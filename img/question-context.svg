<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">Give people something to debug</title>
  <desc id="desc">A focused question supplies code, observations, and prior attempts for investigation. A vague question requires clarification before investigation.</desc>
  <rect width="900" height="250" rx="16" fill="#f1f5f9"/>
  <g font-family="Arial, sans-serif" fill="#172554">
    <text x="30" y="42" font-size="24" font-weight="bold">Context helps the answerer make progress</text>
    <rect x="30" y="65" width="540" height="66" rx="9" fill="#dbeafe"/>
    <text x="48" y="92" font-size="20" font-weight="bold">Focused question</text>
    <text x="48" y="117" font-size="18">Relevant code + observations + what you tried</text>
    <text x="592" y="108" font-size="26">→</text>
    <text x="635" y="106" font-size="20">Investigate the issue</text>
    <rect x="30" y="151" width="540" height="66" rx="9" fill="#e2e8f0"/>
    <text x="48" y="178" font-size="20" font-weight="bold">Vague question</text>
    <text x="48" y="203" font-size="18">Something went wrong. How do I fix it?</text>
    <text x="592" y="194" font-size="26">→</text>
    <text x="635" y="192" font-size="20">Ask for context first</text>
  </g>
</svg>
