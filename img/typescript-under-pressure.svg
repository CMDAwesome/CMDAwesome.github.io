<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Two kinds of feedback</title>
  <desc id="desc">TypeScript gives type checks while writing code. Timed practice adds a deadline and reflection afterward. Both contribute to learning.</desc>
  <rect width="960" height="480" rx="24" fill="#f0f5fa"/>
  <g font-family="Arial, sans-serif">
    <text x="48" y="68" fill="#172b43" font-size="32" font-weight="700">Two kinds of feedback</text>
    <rect x="48" y="106" width="416" height="206" rx="16" fill="#1767a6"/>
    <text x="76" y="152" fill="white" font-size="27" font-weight="700">TypeScript</text>
    <text x="76" y="201" fill="white" font-size="23">Write → Check → Revise</text>
    <text x="76" y="260" fill="#e6f2ff" font-size="21">Feedback while coding</text>
    <rect x="496" y="106" width="416" height="206" rx="16" fill="#784022"/>
    <text x="524" y="152" fill="white" font-size="27" font-weight="700">Timed practice</text>
    <text x="524" y="201" fill="white" font-size="23">Attempt → Reflect → Retry</text>
    <text x="524" y="260" fill="#fff0e6" font-size="21">Learning under a deadline</text>
    <path d="M256 312V343H480 M704 312V343H480V371" fill="none" stroke="#52677c" stroke-width="3"/>
    <path d="M473 362L480 373L487 362" fill="none" stroke="#52677c" stroke-width="3"/>
    <rect x="300" y="382" width="360" height="60" rx="30" fill="#172b43"/>
    <text x="480" y="421" text-anchor="middle" fill="white" font-size="25" font-weight="700">Learning through practice</text>
  </g>
</svg>
